[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seedha-api"
version = "0.1.0"
description = "Seedha API: what each booking channel really leaves a hill hotel"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.143",
  "uvicorn>=0.54",
  "sqlalchemy>=2.1",
  "alembic>=1.20",
  "pydantic>=2.14",
  "python-multipart>=0.0.32",
  "rapidfuzz>=3.14",
  "anthropic>=1.12",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "httpx>=0.28",
  # Polygon Amoy proof signing only (wheels only; resolved set in docs/agent-reports/live/b1-chain.md)
  "eth-account==0.14.0",
  "hexbytes==2.0.0",
  # Stay invoice PDFs (D-100)
  "reportlab==5.0.1",
  # Postgres when hosted (Neon); binary wheels, no libpq build. SQLite needs nothing.
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "mypy>=2.4",
  "pylint>=4.1",
  "bandit>=1.9",
  "pip-audit>=2.10",
  "pre-commit>=4.6",
  "detect-secrets>=1.5",
]

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RET", "ARG", "C4", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLR0913", "ARG001", "ARG002"]
"seed/generate.py" = ["S311", "PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
strict = true
python_version = "3.12"
plugins = []
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "openpyxl.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*", "error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app", "seed"]
branch = true
omit = ["seed/generate.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.pylint.main]
ignore-paths = ["migrations/versions"]
py-version = "3.12"
load-plugins = []
ignored-modules = ["alembic.context"]

[tool.pylint."messages control"]
disable = [
  "too-few-public-methods",
  "missing-module-docstring",
  "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-attributes = 20

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
