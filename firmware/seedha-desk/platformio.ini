; Seedha Desk firmware (ESP32, Arduino framework).
; Device:  pio run -e seedha_desk            (needs include/secrets.h)
; Tests:   pio test -e native                (no hardware, replays the API)

[platformio]
default_envs = seedha_desk

[common]
lib_deps_core = bblanchon/ArduinoJson@7.4.3
warning_flags = -Wall -Wextra -Werror

[env:seedha_desk]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${common.lib_deps_core}
    bodmer/TFT_eSPI@2.5.43
    adafruit/Adafruit NeoPixel@1.15.5
    ricmoo/QRCode@0.0.1
; TFT_eSPI is configured here instead of editing the library (ILI9488, CLAUDE.md pins).
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=27000000
    ; The Desk has no touch panel. This silences TFT_eSPI's own #warning
    ; setup notices only; compiler warnings in Seedha code still fail the build.
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
; Zero warnings in Seedha's own code (libraries are compiled with their defaults).
build_src_flags = ${common.warning_flags}

[env:native]
platform = native
test_framework = unity
lib_deps = ${common.lib_deps_core}
build_flags = -std=c++17 ${common.warning_flags} -DNATIVE_TEST=1
build_src_filter = -<*>
