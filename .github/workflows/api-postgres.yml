# The API test suite on Postgres 16 (as on Neon) and on SQLite (the local demo).
# No secrets: the Postgres credentials below are throwaway values for the
# service container that exists only for the length of the job.
name: api-postgres

on:
  push:
    branches: [deploy, master]
  pull_request:
    branches: [deploy, master]

permissions:
  contents: read

concurrency:
  group: api-postgres-${{ github.ref }}
  cancel-in-progress: true

env:
  MONEY_CODE: app/money.py,app/services/ledger.py,app/services/scenario.py,app/services/slips.py,app/services/savings.py

jobs:
  postgres:
    runs-on: ubuntu-latest
    # Each test empties ~40 tables (TRUNCATE); about 25 minutes on a laptop.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seedha
          POSTGRES_PASSWORD: seedha-ci-only # pragma: allowlist secret (throwaway CI container)
          POSTGRES_DB: seedha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seedha -d seedha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install the API with its dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Create the migrations database
        env:
          PGPASSWORD: seedha-ci-only # pragma: allowlist secret
        run: psql -h localhost -U seedha -d seedha_test -c "CREATE DATABASE seedha_migrations"
      - name: Migrations upgrade to head, match the models, downgrade and upgrade again
        env:
          # The URL form Render and Neon hand out; app.db rewrites it for psycopg 3.
          DATABASE_URL: postgres://seedha:seedha-ci-only@localhost:5432/seedha_migrations # pragma: allowlist secret
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Seed the sample hotel into the migrated database
        env:
          DATABASE_URL: postgres://seedha:seedha-ci-only@localhost:5432/seedha_migrations # pragma: allowlist secret
          DEMO_DATE: "2026-10-13"
        run: python -m seed.load --with-statements
      - name: Full test suite on Postgres
        env:
          TEST_DATABASE_URL: postgresql://seedha:seedha-ci-only@localhost:5432/seedha_test # pragma: allowlist secret
        run: |
          pytest -q --cov --cov-report=term --cov-fail-under=85
          coverage report --include="$MONEY_CODE" --fail-under=100

  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install the API with its dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Migrations upgrade to head on SQLite
        env:
          DATABASE_URL: sqlite:///ci.db
        run: |
          alembic upgrade head
          alembic check
      - name: Full test suite on SQLite
        run: |
          pytest -q --cov --cov-report=term --cov-fail-under=85
          coverage report --include="$MONEY_CODE" --fail-under=100
